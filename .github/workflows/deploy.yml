name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to quazar-msg.ru
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd /opt/quazar
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            bash deploy/scripts/remote-deploy.sh

  bitrix24-pilot-inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/bitrix24-pilot'
    name: Inspect isolated Bitrix24 pilot hosting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect server without changing production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            set -eu
            id
            df -h /opt
            free -m
            docker compose ls
            sudo -n true
            ls -ld /opt/quazar
            sudo -n nginx -T 2>/dev/null | grep -E 'server_name|listen |ssl_certificate |location |proxy_pass ' | head -100
