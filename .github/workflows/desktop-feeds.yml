name: Sync published desktop update feeds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published desktop pilot tag to synchronize
        required: true
        default: desktop-v0.20.3-pilot.1
        type: string

permissions:
  actions: read
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/desktop-release.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
