name: Publish desktop pilot release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Balastov/Quazar-Messager'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the release tag and unchanged application sources
        run: node .github/scripts/desktop-release.cjs
      - name: Verify the successful source workflow and all three artifacts
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const candidate = JSON.parse(fs.readFileSync('.github/desktop-release.json', 'utf8'));
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (repository.private) throw new Error('Anonymous downloads require a public repository');
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: candidate.run_id });
            if (run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'push' ||
                run.path !== '.github/workflows/desktop.yml' || run.head_sha !== candidate.source_sha) {
              throw new Error('The source desktop build is not the expected successful push workflow');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: candidate.run_id });
            for (const name of ['quazar-desktop-win-x64', 'quazar-desktop-mac-arm64', 'quazar-desktop-mac-x64']) {
              const matches = artifacts.filter(item => item.name === name && !item.expired);
              if (matches.length !== 1) throw new Error(`Missing or ambiguous artifact: ${name}`);
            }
            core.setOutput('run-id', String(candidate.run_id));
            core.setOutput('version', candidate.version);
      - uses: actions/download-artifact@v4
        with:
          pattern: quazar-desktop-*
          path: desktop-release-assets
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Validate installers and generate checksums and release notes
        run: node .github/scripts/desktop-release.cjs prepare
      - name: Publish the installers as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "desktop-release-assets/quazar-desktop-win-x64/Quazar-${VERSION}-win-x64.exe" \
            "desktop-release-assets/quazar-desktop-mac-arm64/Quazar-${VERSION}-mac-arm64.dmg" \
            "desktop-release-assets/quazar-desktop-mac-x64/Quazar-${VERSION}-mac-x64.dmg" \
            desktop-release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quazar Desktop ${VERSION} — тестовая версия" \
            --notes-file desktop-release-assets/release-notes.md \
            --prerelease --latest=false --verify-tag
