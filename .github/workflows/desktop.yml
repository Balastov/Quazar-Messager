name: Build desktop test apps

on:
  workflow_dispatch:
  push:
    branches: [main, 'desktop/**']
    paths: ['web/**', 'desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['web/**', 'desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quazar
          POSTGRES_PASSWORD: quazar-test
          POSTGRES_DB: quazar_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -B -m unittest tests.test_oauth_yandex tests.test_phone_verification tests.test_profile
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://quazar:quazar-test@127.0.0.1:5432/quazar_test
          VAPID_PUBLIC_KEY: ''
          VAPID_PRIVATE_KEY: ''

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
        working-directory: web
      - run: npm test
        working-directory: desktop

  build:
    needs: [test, auth]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run prepare:renderer
        working-directory: desktop
      - run: npx electron test/smoke.cjs
        working-directory: desktop
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: quazar-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/release/Quazar-*.exe
            desktop/release/Quazar-*.dmg
            desktop/release/Quazar-*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml
