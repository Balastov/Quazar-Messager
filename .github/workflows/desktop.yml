name: Build desktop test apps

on:
  workflow_dispatch:
  push:
    branches: [main, dev, 'desktop/**']
    paths: ['web/**', 'desktop/**', 'android/**', 'backend/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['web/**', 'desktop/**', 'android/**', 'backend/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quazar
          POSTGRES_PASSWORD: quazar-test
          POSTGRES_DB: quazar_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Test authentication and message receipt privacy
        run: python -B -m unittest tests.test_oauth_yandex tests.test_phone_verification tests.test_password_recovery tests.test_device_pairing tests.test_session_lifetime tests.test_connection_check tests.test_notification_delivery tests.test_profile tests.test_group_readers tests.test_message_status tests.test_message_actions tests.test_chat_features tests.test_news tests.test_pseudonyms
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://quazar:quazar-test@127.0.0.1:5432/quazar_test
          VAPID_PUBLIC_KEY: ''
          VAPID_PRIVATE_KEY: ''

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
        working-directory: web
      - name: Validate user-facing release notes
        run: python3 deploy/scripts/validate-release-notes.py
      - run: npm test
        working-directory: desktop
      - run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

  device-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quazar
          POSTGRES_PASSWORD: quazar-test
          POSTGRES_DB: quazar_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: web
      - name: Test QR login, encrypted keys and device revocation in Chromium
        run: xvfb-run -a python -B desktop/test/run-device-pairing.py
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://quazar:quazar-test@127.0.0.1:5432/quazar_test
          PAIR_TEST_ARTIFACTS: ${{ runner.temp }}/device-pairing
      - name: Test local drafts and connection diagnostics in Chromium
        run: xvfb-run -a python -B desktop/test/run-device-pairing.py
        env:
          BROWSER_TEST_CASE: drafts-connection
          TEST_DATABASE_URL: postgresql+asyncpg://quazar:quazar-test@127.0.0.1:5432/quazar_test
          PAIR_TEST_ARTIFACTS: ${{ runner.temp }}/device-pairing
      - name: Test passing chat keys to an already signed-in device
        run: xvfb-run -a python -B desktop/test/run-device-pairing.py
        env:
          BROWSER_TEST_CASE: key-transfer
          TEST_DATABASE_URL: postgresql+asyncpg://quazar:quazar-test@127.0.0.1:5432/quazar_test
          PAIR_TEST_ARTIFACTS: ${{ runner.temp }}/device-pairing
      - name: Test mobile back swipes and preserved back arrows
        run: xvfb-run -a python -B desktop/test/run-device-pairing.py
        env:
          BROWSER_TEST_CASE: navigation
          TEST_DATABASE_URL: postgresql+asyncpg://quazar:quazar-test@127.0.0.1:5432/quazar_test
          PAIR_TEST_ARTIFACTS: ${{ runner.temp }}/device-pairing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: device-pairing-diagnostics
          path: ${{ runner.temp }}/device-pairing
          if-no-files-found: ignore
          retention-days: 7

  # Образ сайта для деплоя (web/Dockerfile): собирается, а смена номера версии не заставляет
  # заново скачивать пакеты npm — слой с npm ci берётся из кэша.
  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the site image
        run: docker buildx build --progress=plain --load -t quazar-web-check web
      - name: A version bump reuses the npm layer and still builds the site
        run: |
          node -e "const fs = require('fs'); for (const f of ['web/package.json', 'web/package-lock.json']) { const j = JSON.parse(fs.readFileSync(f, 'utf8')); j.version = '99.0.0'; if (j.packages && j.packages['']) j.packages[''].version = '99.0.0'; fs.writeFileSync(f, JSON.stringify(j, null, 2)); }"
          docker buildx build --progress=plain --load -t quazar-web-check web 2>&1 | tee second.log
          step=$(grep -E '^#[0-9]+ \[build [0-9]+/[0-9]+\] RUN .*npm ci' second.log | head -1 | cut -d' ' -f1)
          echo "npm ci step: ${step:-not found}"
          if [ -z "$step" ] || ! grep -qx "$step CACHED" second.log; then
            echo "::error title=web image::npm ci ran again after a version bump — the dependency layer is not cached"
            exit 1
          fi

  android:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/package-lock.json
      - run: npm ci
        working-directory: android
      - name: The Android app has the same version as the other clients
        run: node -e "const v=f=>require('./'+f+'/package.json').version; if (v('android')!==v('web')) throw new Error('android/package.json version must match web')"
      - run: npx cap sync android
        working-directory: android
      - name: Prepare the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice title=Android::No signing key in secrets — building an unsigned check build only"
            exit 0
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quazar.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/quazar.keystore" >> "$GITHUB_ENV"
      - name: Build the Android app
        working-directory: android/native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify the signing certificate and version
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          apk=android/native/app/build/outputs/apk/release/app-release.apk
          # Обновление встанет поверх установленного приложения, только если ключ тот же.
          # Формат строк apksigner меняется между версиями — ищем отпечаток в любой из них.
          report="$("$tools/apksigner" verify --print-certs "$apk" 2>&1 || true)"
          actual="$(printf '%s\n' "$report" | grep -oiE 'certificate SHA-256 digest: [0-9a-f]{64}' | head -1 | grep -oiE '[0-9a-f]{64}$' | tr 'A-F' 'a-f' || true)"
          expected="$(tr -d '[:space:]' < android/signing-certificate.sha256)"
          if [ "$actual" != "$expected" ]; then
            summary="$(printf '%s' "$report" | head -c 1500 | tr '\n' ' ')"
            echo "::error title=Android::Signed with an unexpected key (${actual:-none}); tools=$tools; apksigner: $summary"
            exit 1
          fi
          version="$(node -p "require('./android/package.json').version")"
          "$tools/aapt2" dump badging "$apk" | grep -q "versionName='$version'"
          mkdir -p android/release
          cp "$apk" "android/release/Quazar-$version-android.apk"
          rm -f "$ANDROID_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_FILE != ''
        with:
          name: quazar-desktop-android
          retention-days: 14
          if-no-files-found: error
          path: android/release/Quazar-*-android.apk

  build:
    needs: [test, auth, device-pairing]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: macos-26
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run prepare:renderer
        working-directory: desktop
      - run: npx electron test/smoke.cjs
        working-directory: desktop
      - run: npx electron test/startup-visual.cjs
        working-directory: desktop
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        working-directory: desktop
      - name: Verify a real installed Windows upgrade and retained profile
        if: matrix.platform == 'win'
        run: node test/windows-upgrade.cjs
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: quazar-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/release/Quazar-*.exe
            desktop/release/Quazar-*.dmg
            desktop/release/Quazar-*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml
