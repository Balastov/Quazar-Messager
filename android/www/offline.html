<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quazar — нет связи</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1117; color: #e8e8f0;
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #a0a3b5; }
  button { border: 0; border-radius: 999px; padding: 12px 24px; background: #6c63ff; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Нет связи с Quazar</h1>
  <p>Проверьте интернет — приложение откроется, как только связь появится.</p>
  <button type="button" onclick="location.href='https://quazar-msg.ru/'">Повторить</button>
</main>
<script>
  // Связь вернулась — открываем Quazar сами.
  addEventListener('online', function () { location.href = 'https://quazar-msg.ru/'; });
</script>
</body>
</html>
