server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = / { return 302 /bitrix24-pilot/bitrix24.html; }
    location = /healthz { default_type text/plain; return 200 "bitrix24-pilot ready\n"; }
    location = /bitrix24.html {
        try_files $uri =404;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors https://is4business.bitrix24.ru" always;
    }
    location /assets/ { try_files $uri =404; }
    location /icons/ { try_files $uri =404; }
    location /api/integrations/bitrix24/ {
        proxy_pass http://backend:8000/integrations/bitrix24/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    # No ordinary Quazar API, main page, database or media is published in this pilot.
    location / { return 404; }
}
