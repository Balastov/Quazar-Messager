# System nginx vhost for Quazar on a shared VM (alongside padma.ru / mispring.ru).
# Install:
#   sudo cp deploy/host-nginx/quazar-msg.ru.conf /etc/nginx/sites-available/quazar-msg.ru
#   sudo ln -sf /etc/nginx/sites-available/quazar-msg.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d quazar-msg.ru -d www.quazar-msg.ru

# HTTP — ACME + redirect (certbot may adjust this)
server {
    listen 80;
    listen [::]:80;
    server_name quazar-msg.ru www.quazar-msg.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — enable after certbot, or use temporary self-signed first
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quazar-msg.ru www.quazar-msg.ru;

    # certbot --nginx will fill these; placeholders until then:
    ssl_certificate     /etc/letsencrypt/live/quazar-msg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quazar-msg.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8002/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
