<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'">
<title>Quazar — оверлей</title>
<style>
[hidden]{display:none!important}
html,body{margin:0;background:transparent;overflow:hidden;user-select:none;cursor:default}
body{font:13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f1ff}
#stack{display:flex;flex-direction:column;gap:6px}
#stack.up{flex-direction:column-reverse}
#toasts{display:flex;flex-direction:column;gap:6px}
#panel{box-sizing:border-box;margin:0;padding:8px 10px;box-shadow:inset 0 0 0 1px #ffffff1f;border-radius:12px;background:rgb(12 11 20/var(--bg,.78))}
#room{display:flex;align-items:center;gap:6px;height:24px;color:#34d399;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#room.lost{color:#fbbf24}
#rec{display:flex;align-items:center;gap:6px;height:22px;color:#fca5a5;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rec .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#ef4444;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
#focus{display:flex;align-items:center;gap:6px;height:22px;color:#c4b5fd;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#focus svg{flex:none;width:13px;height:13px}
.state .screen{color:#60a5fa}
.peer{display:flex;align-items:center;gap:8px;height:28px;opacity:.82;transition:opacity .15s}
.peer.speaking{opacity:1}
.avatar{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#2a2340;color:#cfc6e6;font-size:11px;font-weight:700;box-shadow:0 0 0 2px transparent;transition:box-shadow .12s}
.peer.speaking .avatar{box-shadow:0 0 0 2px #34d399}
.name{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000a}
.peer.speaking .name{color:#fff}
.state{flex:none;display:flex;gap:3px;color:#f87171}
.state svg{width:14px;height:14px}
#more{height:20px;color:#b6adc6;font-size:12px;padding-left:30px}
#place{display:flex;align-items:center;justify-content:space-between;gap:8px;height:30px;color:#c4b5fd;font-size:12px}
body.placing #panel{-webkit-app-region:drag;box-shadow:inset 0 0 0 2px #8b83ff;cursor:move}
body.placing button{-webkit-app-region:no-drag}
.toast{box-sizing:border-box;padding:8px 10px 8px 12px;border-radius:12px;background:rgb(12 11 20/var(--bg,.78));box-shadow:inset 0 0 0 1px #ffffff1f,inset 3px 0 0 0 var(--kind,#b6adc6)}
.toast.call{--kind:#34d399}.toast.knock{--kind:#fbbf24}.toast.invite{--kind:#8b83ff}.toast.meeting{--kind:#60a5fa}
.toast .t{height:18px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000a}
.toast.info .t{height:34px;line-height:17px;font-weight:500;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toast .s{height:16px;line-height:16px;font-size:12px;color:#b6adc6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .a{display:flex;gap:6px;height:24px;margin-top:6px}
button{flex:1 1 auto;min-width:0;height:24px;padding:0 4px;border:0;border-radius:7px;font:600 12px/24px system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f1ff;background:#ffffff24;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.primary{background:#16a34a}
button.danger{background:#dc2626d9}
button:hover{filter:brightness(1.18)}
#place button{flex:none;padding:0 12px;background:#6c63ff}
</style></head>
<body><div id="stack"><div id="panel" role="status" aria-live="off"><div id="room"></div><div id="rec" hidden><span class="dot"></span><span id="rec-text"></span></div><div id="focus" hidden></div><div id="peers"></div><div id="more" hidden></div><div id="place" hidden><span>✥ Перетащите оверлей</span><button type="button" id="place-done">Готово</button></div></div><div id="toasts" hidden></div></div><script src="overlay.js"></script></body></html>
