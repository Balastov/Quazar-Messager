<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'">
<title>Quazar — обновление</title><link rel="stylesheet" href="startup.css"></head>
<body><main><img src="../renderer/icons/icon-192.png" alt="" width="64" height="64"><h1>Quazar</h1>
<div role="status" aria-live="polite"><h2 id="heading">Проверяем обновления…</h2><p id="message">Это займёт немного времени.</p></div>
<progress id="progress" aria-label="Загрузка обновления"></progress><p id="version"></p>
<div id="actions"><button id="retry" hidden>Повторить</button><button id="continue" hidden>Продолжить без проверки</button><button id="quit">Завершить</button></div>
</main><script src="startup.js"></script></body></html>
