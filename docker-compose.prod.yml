# Production stack for quazar-msg.ru
#
# Shared VM (padma.ru / mispring.ru already on system nginx) — default:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   then install deploy/host-nginx/quazar-msg.ru.conf into system nginx
#
# Dedicated VM (Quazar owns 80/443):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile edge up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quazar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-quazar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quazar} -d ${POSTGRES_DB:-quazar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      # Host nginx proxies here (8000 is often used by other apps on shared VMs)
      - "127.0.0.1:8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quazar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quazar}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://quazar-msg.ru,https://www.quazar-msg.ru}
      MEDIA_ROOT: /app/media
      # Картинки в чатах не принимаются, если на диске останется меньше (МБ).
      MEDIA_MIN_FREE_MB: ${MEDIA_MIN_FREE_MB:-2048}
      # Картинки из чатов удаляются через столько дней (0 — хранить бессрочно).
      ATTACHMENT_TTL_DAYS: ${ATTACHMENT_TTL_DAYS:-30}
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      WEBRTC_TURN_URLS: ${WEBRTC_TURN_URLS:-}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-}
      WEBRTC_TURN_CREDENTIAL: ${WEBRTC_TURN_CREDENTIAL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@quazar-msg.ru}
      CALL_RING_TIMEOUT_SEC: ${CALL_RING_TIMEOUT_SEC:-45}
      # Голос на Планетах (profile voice). Пустые ключи = голос выключен.
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://${DOMAIN:-quazar-msg.ru}/livekit
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Ники владельцев ресурса через запятую (роль выдаётся при старте).
      SUPERUSER_BOOTSTRAP: ${SUPERUSER_BOOTSTRAP:-}
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:80"

  # Only for a dedicated server where Quazar owns ports 80/443.
  nginx:
    build: ./deploy/nginx
    restart: unless-stopped
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-quazar-msg.ru}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - backend
      - web

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh
    profiles: ["certs"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]

  # WebRTC relay for calls behind NAT (profile turn — see docs/WEBRTC-TURN.md)
  coturn:
    image: coturn/coturn:4.6.2-r10
    restart: unless-stopped
    profiles: ["turn"]
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49252:49152-49252/udp"
    command: ["-c", "/etc/coturn/turnserver.conf"]

  # Медиасервер голосовых Планет (profile voice — см. docs/VOICE-PLANETS.md).
  # Снаружи: 7881/tcp и 7882/udp; сигналинг 7880 — только через host nginx (/livekit/).
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    profiles: ["voice"]
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"

volumes:
  postgres_data:
  media_data:
  certbot_www:
  certbot_conf:
