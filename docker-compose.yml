services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quazar
      POSTGRES_PASSWORD: quazar
      POSTGRES_DB: quazar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://quazar:quazar@postgres:5432/quazar
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
