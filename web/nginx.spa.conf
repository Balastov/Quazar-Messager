server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # «Войти в Padma через Квазар»: страницу с кнопкой «Продолжить» нельзя встроить в чужой сайт
    # (CSP frame-ancestors в <meta> браузеры не применяют — нужен заголовок).
    location ^~ /oauth/ {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /desktop-updates/ {
        alias /usr/share/nginx/desktop-updates/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
